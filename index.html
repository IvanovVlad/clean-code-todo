<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" type="text/css" />
  </head>
  <body>
    <div class="aaa">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower matrix" /><a
        class="more_inf"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </div>
    <div class="centered-main-page-element">
      <div id="topSectionForAddingElementToList">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text" /><button>Add</button>
        </div>
      </div>
      <h3>Todo</h3>
      <ul id="incompleteTasks">
        <li>
          <input type="checkbox" id="task-1" /><label class="task" for="task-1"
            >Pay Bills</label
          >
          <input type="text" class="task" aria-label="Edit task" /><button
            class="edit"
          >
            Edit</button
          ><button class="delete">
            <img src="./remove.svg" alt="Delete" />
          </button>
        </li>
        <li class="editMode">
          <input type="checkbox" id="task-2" /><label class="task" for="task-2"
            >Go Shopping</label
          ><input
            type="text"
            value="Go Shopping"
            class="task"
            aria-label="Edit task"
          /><button class="edit">Save</button
          ><button class="delete">
            <img src="./remove.svg" alt="Delete" />
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" id="task-3" checked /><label
            class="task"
            for="task-3"
            >See the Doctor</label
          ><input type="text" class="task" aria-label="Edit task" /><button
            class="edit"
          >
            Edit</button
          ><button class="delete">
            <img src="./remove.svg" alt="Delete" />
          </button>
        </li>
      </ul>
    </div>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
